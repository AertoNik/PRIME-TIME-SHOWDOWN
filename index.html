<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- 1.8.2: Content Security Policy — scripts only from the game itself (no inline or injected
         scripts), data:/blob: only for images, fonts and audio the game makes itself, network: the
         game's own files plus an https accounts API (the local test API / Vite on 127.0.0.1 in dev). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070816" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PRIME TIME: SHOWDOWN — стилизованная 3D-дуэль тактических карт и карьера продюсера ТВ-шоу боёв." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>PRIME TIME: SHOWDOWN</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060f; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #22f0e0;
        font: 900 14px/1 system-ui, sans-serif; letter-spacing: .2em; }
      #boot::after { content: 'PRIME TIME · LOADING'; animation: b 1s ease-in-out infinite alternate; }
      @keyframes b { from { opacity: .3 } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <div id="stage"></div>
        <div id="ui"></div>
      </div>
    </div>
    <div id="boot"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
