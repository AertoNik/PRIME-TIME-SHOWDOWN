<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10151a"><meta name="description" content="PRIME TIME: SHOWDOWN — мобильные 3D-дуэли в прямом эфире."><link rel="icon" type="image/svg+xml" href="./favicon.svg"><title>PRIME TIME: SHOWDOWN</title></head><body><main id="game"><div id="boot" style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#f6bd4f;background:#10171f;z-index:40;font:700 20px Arial"><span>PRIME TIME</span><small style="font-size:10px;margin-top:16px;letter-spacing:2px">НАСТРАИВАЕМ ЭФИР…</small><noscript style="font-size:12px;margin-top:20px">Для игры включи JavaScript.</noscript></div><div id="stage"></div><div id="ui"></div><div id="toast" role="status"></div><div id="fatal" hidden></div></main><noscript>Для игры включи JavaScript в браузере.</noscript><script>
function loadingFailure(){var boot=document.getElementById('boot');if(boot)boot.innerHTML='<span>СИГНАЛ ПОТЕРЯН</span><small style="font-size:12px;line-height:1.7;margin:20px">Не удалось загрузить игру.<br>Проверь подключение и обнови страницу.</small>';}
window.addEventListener('error',function(event){if(event.target instanceof HTMLScriptElement)loadingFailure();},true);
setTimeout(loadingFailure,15000);
</script><script type="module" src="/src/main.ts"></script></body></html>
